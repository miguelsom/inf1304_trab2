<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sebo</title>
<style>
  body { font-family: sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; }
  fieldset { margin-bottom: 20px; padding: 16px; }
  input { display: block; width: 100%; margin: 6px 0 12px; padding: 6px; box-sizing: border-box; }
  button { padding: 8px 14px; margin-right: 6px; cursor: pointer; }
  #resultado { padding: 10px; background: #eef; min-height: 20px; }
</style>
</head>
<body>
<h1>📚 Sebo</h1>

<fieldset>
  <legend>Área do cliente</legend>
  E-mail <input id="cEmail" type="email" placeholder="voce@exemplo.com">
  Título do livro <input id="cTitulo" placeholder="Dom Casmurro">
  <button onclick="solicitar()">Tenho interesse</button>
</fieldset>

<fieldset>
  <legend>Área do colaborador</legend>
  Título do livro <input id="fTitulo" placeholder="Dom Casmurro">
  Quantidade que chegou <input id="fQtd" type="number" min="1" value="1">
  <button onclick="entrada()">Registrar chegada</button>
  <button onclick="venda()">Registrar venda (1 un.)</button>
</fieldset>

<div id="resultado"></div>

<script>
// ---------------------------------------------------------------------------
// >>> AJUSTAR AO TROCAR DE CONTA <<<
// Cole aqui a "URL da função" (Function URL) de cada Lambda da SUA conta.
// Onde achar: Lambda -> <função> -> Visão geral da função -> "URL da função".
// Formato: https://<id>.lambda-url.us-east-1.on.aws/
// Valores abaixo = conta da entrega (ambiente 1 do SETUP.md, seção 3.1).
// ---------------------------------------------------------------------------
const URL_SOLICITAR = 'https://twv746thww6nlc5ar537npvnz40ntrsi.lambda-url.us-east-1.on.aws/';  // solicitarLivro
const URL_ENTRADA   = 'https://pcyctdpq42ml7nwvdjmbzpoceq0gbilb.lambda-url.us-east-1.on.aws/';  // entradaEstoque
const URL_VENDA     = 'https://7d5izk2ym3p72o6adtztgc6lra0fejxn.lambda-url.us-east-1.on.aws/';  // registrarVenda

const val = id => document.getElementById(id).value;

async function chamar(url, dados) {
  const saida = document.getElementById('resultado');
  saida.textContent = 'Enviando...';
  try {
    const r = await fetch(url, { method: 'POST', body: JSON.stringify(dados) });
    saida.textContent = (await r.json()).mensagem;
  } catch (e) {
    saida.textContent = 'Erro de comunicação: ' + e;
  }
}

function solicitar() { chamar(URL_SOLICITAR, { email: val('cEmail'), titulo: val('cTitulo') }); }
function entrada()   { chamar(URL_ENTRADA,   { titulo: val('fTitulo'), quantidade: val('fQtd') }); }
function venda()     { chamar(URL_VENDA,     { titulo: val('fTitulo') }); }
</script>
</body>
</html>
